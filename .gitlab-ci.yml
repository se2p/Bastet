image: node:24

before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store

stages:
    - build
    - test

cache:
    paths:
        - .pnpm-store/

install_dependencies:
    stage: build
    script:
        - pnpm install --frozen-lockfile
        - mkdir -p output/static
    artifacts:
        paths:
            - node_modules/

testing_fast:
    stage: test
    script:
        - pnpm run build-no-lint
        - pnpm run test:fast
        - mkdir -p output/static

testing_slow:
    stage: test
    script:
        - pnpm run build-no-lint
        - pnpm run test:slow
        - pnpm run test:slow:deadline
        - mkdir -p output/static
